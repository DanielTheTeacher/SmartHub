<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hubba Bubba</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #090d16; --card: #131b2e; --border: #1e293b; --btn: #1e293b;
    --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px; max-width: 440px; margin-inline: auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
  .badge {
    font-size: 0.75rem; font-weight: 600; padding: 5px 10px;
    border-radius: 99px; background: var(--btn); color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .badge.online .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 700; margin: 0 0 12px 0;
  }
  button {
    background: var(--btn); color: var(--text); border: 1px solid transparent;
    padding: 12px 8px; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: 0.15s;
  }
  button:active { transform: scale(0.96); }
  button.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); border-color: var(--accent); }
  button.power-on.active { background: rgba(34, 197, 94, 0.18); color: var(--green); border-color: var(--green); }
  .thermo {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); border-radius: 16px; padding: 12px 20px; margin: 12px 0;
  }
  .temp-btn {
    width: 46px; height: 46px; border-radius: 50%; font-size: 1.4rem;
    padding: 0; display: flex; align-items: center; justify-content: center;
  }
  .temp-display { font-size: 2.3rem; font-weight: 800; }
  .seg-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .seg-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .seg-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .label { font-size: 0.8rem; color: var(--muted); margin: 12px 0 6px; }
  .light-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .light-row:last-of-type { border-bottom: none; }
  .light-name { font-size: 0.95rem; font-weight: 500; }
  .pill-group { display: flex; gap: 6px; }
  .pill-group button { padding: 8px 16px; font-size: 0.85rem; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 6px; background: var(--bg); border-radius: 8px; margin-top: 6px; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #090d16; font-weight: 700;
    font-size: 0.8rem; padding: 8px 16px; border-radius: 99px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

  <header>
    <h1>Hubba Bubba</h1>
    <div id="status" class="badge"><span class="dot"></span><span id="sText">Kobler til...</span></div>
  </header>

  <!-- VARMEPUMPE -->
  <div class="card">
    <div class="card-title">Varmepumpe</div>
    <div class="seg-2">
      <button id="hp-on" class="power-on" onclick="setHpPower(true)">PÅ</button>
      <button id="hp-off" class="active" onclick="setHpPower(false)">AV</button>
    </div>

    <div class="thermo">
      <button class="temp-btn" onclick="adjTemp(-1)">−</button>
      <div class="temp-display" id="tVal">21°</div>
      <button class="temp-btn" onclick="adjTemp(1)">+</button>
    </div>

    <div class="label">Modus</div>
    <div class="seg-3" id="mode-group">
      <button class="active" onclick="setHpMode(this, 4)">☀️ Varme</button>
      <button onclick="setHpMode(this, 1)">❄️ Kjøling</button>
      <button onclick="setHpMode(this, 0)">🔄 Auto</button>
    </div>

    <div class="label">Vifte & Swing</div>
    <div class="seg-4" id="fan-group">
      <button onclick="setHpFan(this, 0)">Auto</button>
      <button onclick="setHpFan(this, 4)">Stille</button>
      <button class="active" onclick="setHpFan(this, 2)">Med</button>
      <button onclick="setHpFan(this, 1)">Høy</button>
    </div>
    <div class="seg-2" id="swing-group" style="margin-top:8px">
      <button onclick="setHpSwing(this, 'ON')">Swing PÅ</button>
      <button class="active" onclick="setHpSwing(this, 'OFF')">Swing AV</button>
    </div>
  </div>

  <!-- SCENER -->
  <div class="card">
    <div class="card-title">Scener</div>
    <div class="seg-3">
      <button onclick="send('LP:SET_ALL,ON;')">💡 Alle På</button>
      <button onclick="send('LP:SET_ALL,OFF;')">🌑 Alle Av</button>
      <button onclick="send('LP:SET_SCENE,KINO-MODUS;')">🎬 Kino</button>
    </div>
  </div>

  <!-- LYSSTYRING -->
  <div class="card">
    <div class="card-title">Lysstyring</div>
    <div class="light-row">
      <span class="light-name">Nexa Lys 1</span>
      <div class="pill-group" id="l1">
        <button onclick="pick(this,'l1'); send('LP:SET_LIGHT,1,ON;')">PÅ</button>
        <button onclick="pick(this,'l1'); send('LP:SET_LIGHT,1,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Nexa Lys 2</span>
      <div class="pill-group" id="l2">
        <button onclick="pick(this,'l2'); send('LP:SET_LIGHT,2,ON;')">PÅ</button>
        <button onclick="pick(this,'l2'); send('LP:SET_LIGHT,2,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Nexa Lys 3</span>
      <div class="pill-group" id="l3">
        <button onclick="pick(this,'l3'); send('LP:SET_LIGHT,3,ON;')">PÅ</button>
        <button onclick="pick(this,'l3'); send('LP:SET_LIGHT,3,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Lysbryter (4)</span>
      <div class="label" style="margin-top:14px">Individuelle Stikkontakter</div>
    <div class="light-row">
      <span class="light-name">Stikk 1</span>
      <div class="pill-group" id="l5">
        <button onclick="pick(this,'l5'); send('LP:SET_LIGHT,5,ON;')">PÅ</button>
        <button onclick="pick(this,'l5'); send('LP:SET_LIGHT,5,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Stikk 2</span>
      <div class="pill-group" id="l6">
        <button onclick="pick(this,'l6'); send('LP:SET_LIGHT,6,ON;')">PÅ</button>
        <button onclick="pick(this,'l6'); send('LP:SET_LIGHT,6,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Stikk 3</span>
      <div class="pill-group" id="l7">
        <button onclick="pick(this,'l7'); send('LP:SET_LIGHT,7,ON;')">PÅ</button>
        <button onclick="pick(this,'l7'); send('LP:SET_LIGHT,7,OFF;')">AV</button>
      </div>
    </div>
    <div class="light-row">
      <span class="light-name">Stikk 4</span>
      <div class="pill-group" id="l8">
        <button onclick="pick(this,'l8'); send('LP:SET_LIGHT,8,ON;')">PÅ</button>
        <button onclick="pick(this,'l8'); send('LP:SET_LIGHT,8,OFF;')">AV</button>
      </div>
    </div>
      <div class="pill-group" id="l4">
        <button onclick="pick(this,'l4'); send('LP:SET_LIGHT,4,ON;')">PÅ</button>
        <button onclick="pick(this,'l4'); send('LP:SET_LIGHT,4,OFF;')">AV</button>
      </div>
    </div>

    <div class="label" style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      <span>Spisestue Dimmer (<span id="dVal">50</span>%)</span>
      <button style="padding:4px 10px;font-size:0.75rem" onclick="send('LP:SET_DIMMER,7,OFF;')">AV</button>
    </div>
    <input type="range" min="0" max="100" step="5" value="50"
      oninput="document.getElementById('dVal').innerText=this.value"
      onchange="send('LP:SET_DIMMER,7,'+this.value+';')">

    <div class="label">IR LED-stripe</div>
    <div class="seg-4" style="margin-bottom:8px">
      <button onclick="send('LP:SET_DIMMER,9,ON;')">PÅ</button>
      <button onclick="send('LP:SET_DIMMER,9,OFF;')">AV</button>
      <button onclick="send('LP:SET_DIMMER,9,DOWN;')">− Lav</button>
      <button onclick="send('LP:SET_DIMMER,9,UP;')">+ Høy</button>
    </div>
    <div class="seg-5" id="led-group">
      <button onclick="pick(this,'led-group'); send('LP:SET_DIMMER,9,KINO;')">🎬 Kino</button>
      <button onclick="pick(this,'led-group'); send('LP:SET_DIMMER,9,25;')">25%</button>
      <button onclick="pick(this,'led-group'); send('LP:SET_DIMMER,9,50;')">50%</button>
      <button onclick="pick(this,'led-group'); send('LP:SET_DIMMER,9,75;')">75%</button>
      <button onclick="pick(this,'led-group'); send('LP:SET_DIMMER,9,100;')">100%</button>
    </div>
  </div>

  <div id="toast">Sendt</div>

<script>
const TOPIC = "hubbabubba/danie_9842_secret/cmd";
const isLocal = location.hostname.startsWith("10.") || location.hostname.startsWith("192.");
const badge = document.getElementById("status");
const sText = document.getElementById("sText");
let client = null;

if (isLocal) {
  badge.classList.add("online");
  sText.innerText = "Lokal WiFi";
} else {
  client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
  client.on("connect", () => { badge.classList.add("online"); sText.innerText = "Tilkoblet"; });
}

// Unified Heat Pump State (Always sends all parameters together)
let hp = { power: false, temp: 21, mode: 4, fan: 2, swing: "OFF" };

function sendHpState(turnOnSwitch = false) {
  if (!hp.power) {
    send("HP:OFF;");
  } else {
    // Sends PowerTrigger, Temp, Mode, Fan, Swing in one atomic packet
    const pwrFlag = turnOnSwitch ? "WAKE" : "ON";
    send(`HP:STATE,${pwrFlag},${hp.temp},${hp.mode},${hp.fan},${hp.swing};`);
  }
}

function setHpPower(on) {
  const wasOff = !hp.power;
  hp.power = on;
  setHpPowerUI(on);
  sendHpState(on && wasOff);
}

function adjTemp(d) {
  const wasOff = !hp.power;
  hp.temp = Math.min(26, Math.max(18, hp.temp + d));
  document.getElementById("tVal").innerText = hp.temp + "°";
  hp.power = true;
  setHpPowerUI(true);
  sendHpState(wasOff);
}

function setHpMode(btn, m) {
  const wasOff = !hp.power;
  pick(btn, "mode-group");
  hp.mode = m;
  hp.power = true;
  setHpPowerUI(true);
  sendHpState(wasOff);
}

function setHpFan(btn, f) {
  const wasOff = !hp.power;
  pick(btn, "fan-group");
  hp.fan = f;
  hp.power = true;
  setHpPowerUI(true);
  sendHpState(wasOff);
}

function setHpSwing(btn, s) {
  const wasOff = !hp.power;
  pick(btn, "swing-group");
  hp.swing = s;
  hp.power = true;
  setHpPowerUI(true);
  sendHpState(wasOff);
}

function setHpPowerUI(on) {
  document.getElementById("hp-on").classList.toggle("active", on);
  document.getElementById("hp-off").classList.toggle("active", !on);
}

function pick(btn, groupId) {
  document.querySelectorAll("#" + groupId + " button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1200);
}

function send(cmd) {
  if (isLocal) {
    fetch("/command", { method: "POST", headers: {"Content-Type":"text/plain"}, body: cmd });
  } else if (client) {
    client.publish(TOPIC, cmd);
  }
  showToast("Sendt: " + cmd.replace(";", ""));
}
</script>
</body>
</html>
