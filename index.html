<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hubba Bubba Fjernstyring</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; max-width: 600px; margin-inline: auto; }
  h1 { font-size: 1.3rem; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; background: #ef4444; color: white; }
  .badge.online { background: #22c55e; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1.1rem; margin: 0 0 12px 0; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button { background: #334155; color: var(--text); border: 1px solid #475569; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  button:active { background: var(--accent); color: #0f172a; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .temp-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 12px 0; }
  .temp-val { font-size: 2rem; font-weight: 700; }
  #log { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>
    <span>Hubba Bubba (Fjernstyring)</span>
    <span id="status" class="badge">Kobler til...</span>
  </h1>
  <div id="log">Klar</div>

  <div class="card">
    <h2>Hurtigvalg & Scener</h2>
    <div class="grid-3">
      <button onclick="send('LP:SET_ALL,ON;')">Alle På</button>
      <button onclick="send('LP:SET_ALL,OFF;')">Alle Av</button>
      <button onclick="send('LP:SET_SCENE,KINO-MODUS;')">Kino-Modus</button>
    </div>
  </div>

  <div class="card">
    <h2>Lysstyring (RF & IR)</h2>
    <div class="row"><span>Nexa Lys 1</span><div><button onclick="send('LP:SET_LIGHT,1,ON;')">PÅ</button> <button onclick="send('LP:SET_LIGHT,1,OFF;')">AV</button></div></div>
    <div class="row"><span>Nexa Lys 2</span><div><button onclick="send('LP:SET_LIGHT,2,ON;')">PÅ</button> <button onclick="send('LP:SET_LIGHT,2,OFF;')">AV</button></div></div>
    <div class="row"><span>Nexa Lys 3</span><div><button onclick="send('LP:SET_LIGHT,3,ON;')">PÅ</button> <button onclick="send('LP:SET_LIGHT,3,OFF;')">AV</button></div></div>
    <div class="row"><span>Lysbryter (4)</span><div><button onclick="send('LP:SET_LIGHT,4,ON;')">PÅ</button> <button onclick="send('LP:SET_LIGHT,4,OFF;')">AV</button></div></div>
    <hr style="border-color:#334155;margin:12px 0">
    <div class="row">
      <span>Spisestue Dimmer</span>
      <input type="range" min="0" max="100" step="5" value="50" onchange="send('LP:SET_DIMMER,7,'+this.value+';')">
      <button onclick="send('LP:SET_DIMMER,7,OFF;')">AV</button>
    </div>
    <div class="row">
      <span>IR LED-stripe</span>
      <div class="grid-3" style="flex:1">
        <button onclick="send('LP:SET_DIMMER,9,0;')">Av/På</button>
        <button onclick="send('LP:SET_DIMMER,9,25;')">25%</button>
        <button onclick="send('LP:SET_DIMMER,9,50;')">50%</button>
        <button onclick="send('LP:SET_DIMMER,9,100;')">100%</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Varmepumpe</h2>
    <div class="grid">
      <button onclick="send('HP:ON;')">PÅ</button>
      <button onclick="send('HP:OFF;')">AV</button>
    </div>
    <div class="temp-ctrl">
      <button onclick="adjTemp(-1)">−</button>
      <span class="temp-val" id="tVal">21°C</span>
      <button onclick="adjTemp(1)">+</button>
    </div>
    <div class="row"><span>Modus:</span>
      <div class="grid-3" style="flex:1">
        <button onclick="send('HP:MODE,4;')">Varme</button>
        <button onclick="send('HP:MODE,1;')">Kjøling</button>
        <button onclick="send('HP:MODE,0;')">Auto</button>
      </div>
    </div>
    <div class="row"><span>Vifte:</span>
      <div class="grid-3" style="flex:1">
        <button onclick="send('HP:FAN,0;')">Auto</button>
        <button onclick="send('HP:FAN,4;')">Stille</button>
        <button onclick="send('HP:FAN,2;')">Med</button>
        <button onclick="send('HP:FAN,1;')">Høy</button>
      </div>
    </div>
    <div class="grid" style="margin-top:10px">
      <button onclick="send('HP:SWING,ON;')">Swing PÅ</button>
      <button onclick="send('HP:SWING,OFF;')">Swing AV</button>
    </div>
  </div>

<script>
const TOPIC = "hubbabubba/danie_9842_secret/cmd";
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
const badge = document.getElementById("status");
const logEl = document.getElementById("log");

client.on("connect", () => {
  badge.innerText = "Tilkoblet";
  badge.classList.add("online");
});

let temp = 21;
function adjTemp(d) {
  temp = Math.min(26, Math.max(18, temp + d));
  document.getElementById("tVal").innerText = temp + "°C";
  send("HP:TEMP," + temp + ";");
}

function send(cmd) {
  client.publish(TOPIC, cmd);
  logEl.innerText = "Sendt: " + cmd;
}
</script>
</body>
</html>
